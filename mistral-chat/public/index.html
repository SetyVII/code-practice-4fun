<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mistral Chat</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; display: flex; justify-content: center; }
    main { width: 100%; max-width: 720px; height: 100vh; display: flex; flex-direction: column; padding: 1rem; }
    h1 { font-size: 1.1rem; margin: 0.5rem 0 1rem; }
    #messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; padding: 0.75rem; border: 1px solid #8884; border-radius: 8px; }
    .msg { max-width: 80%; padding: 0.5rem 0.75rem; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .user { align-self: flex-end; background: #4f46e5; color: #fff; }
    .assistant { align-self: flex-start; background: #8882; }
    .error { align-self: center; background: #dc2626; color: #fff; }
    form { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
    input { flex: 1; padding: 0.6rem 0.75rem; border-radius: 8px; border: 1px solid #8886; background: transparent; color: inherit; }
    button { padding: 0.6rem 1rem; border: 0; border-radius: 8px; background: #4f46e5; color: #fff; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <main>
    <h1>Mistral Chat &mdash; mistral-small-latest</h1>
    <div id="messages"></div>
    <form id="form">
      <input id="input" placeholder="Type a message&hellip;" autocomplete="off" required />
      <button id="send" type="submit">Send</button>
    </form>
  </main>
  <script>
    const messagesEl = document.getElementById('messages');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const history = [];

    function addMessage(role, text) {
      const div = document.createElement('div');
      div.className = role === 'error' ? 'error' : 'msg ' + role;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      send.disabled = true;
      addMessage('user', text);
      const pending = addMessage('assistant', '\u2026');
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ messages: [...history, { role: 'user', content: text }] }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Request failed');
        pending.textContent = data.reply;
        history.push({ role: 'user', content: text }, { role: 'assistant', content: data.reply });
      } catch (err) {
        pending.className = 'error';
        pending.textContent = err.message;
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
